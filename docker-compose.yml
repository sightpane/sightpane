# docker compose up -d --build              →  http://localhost:8790
# docker compose --profile ceph up -d        →  the same, with frames in Ceph
#
# The build pulls the dashboard from github.com/sightpane/ui; pin it with
# `UI_REF` below, or set it to `none` for an API-only image.
services:
  sightpane:
    build:
      context: .
      args:
        UI_REF: "${UI_REF:-main}"
    image: ghcr.io/sightpane/sightpane:latest
    container_name: sightpane
    ports:
      - "8790:8790"
    environment:
      SIGHTPANE_DEFAULT_PROJECT: "Casino CRM"
      SIGHTPANE_DEFAULT_KEY: "dev" # the first project key handed to the SDK
      SIGHTPANE_ADMIN_EMAIL: "admin@sightpane.local"
      SIGHTPANE_ADMIN_PASSWORD: "admin123" # change this in production
      # Replay frames: "fs" keeps them in the volume below, "s3" puts them in an
      # object store. The ceph profile below sets this to s3 for you.
      SIGHTPANE_FRAMES: "${SIGHTPANE_FRAMES:-fs}"
      SIGHTPANE_S3_ENDPOINT: "${SIGHTPANE_S3_ENDPOINT:-}"
      SIGHTPANE_S3_BUCKET: "${SIGHTPANE_S3_BUCKET:-sightpane-frames}"
      SIGHTPANE_S3_ACCESS_KEY: "${SIGHTPANE_S3_ACCESS_KEY:-}"
      SIGHTPANE_S3_SECRET_KEY: "${SIGHTPANE_S3_SECRET_KEY:-}"
    volumes:
      - sightpane-data:/data # sightpane.db, and the frame PNGs when SIGHTPANE_FRAMES=fs
    restart: unless-stopped
    # For the real client IP: put this behind a reverse proxy that sends
    # X-Forwarded-For / X-Real-IP (the backend reads those headers), or use
    # `network_mode: host` instead of the bridge network (then drop `ports`).

  # Ceph, for keeping replay frames in an object store instead of a volume.
  #
  # Why: frames are the only part of the data that grows without bound, and a
  # local directory cannot be shared, so a second backend replica would serve
  # 404s for half the frames. Ceph replicates and scrubs the objects itself and
  # grows by adding OSDs, and its RADOS Gateway speaks S3, which is the API the
  # backend already uses.
  #
  # This is the upstream all-in-one demo image: one container running mon, mgr,
  # osd and rgw. It is meant for development and for trying the S3 path — a real
  # deployment runs a Ceph cluster of its own and only needs SIGHTPANE_S3_* pointed at
  # its gateway. MinIO or AWS S3 work through the same settings.
  ceph:
    image: quay.io/ceph/demo:latest
    container_name: sightpane-ceph
    profiles: ["ceph"]
    environment:
      # A single-node demo cluster: one monitor, one OSD, no redundancy.
      MON_IP: 127.0.0.1
      CEPH_PUBLIC_NETWORK: 0.0.0.0/0
      CEPH_DEMO_UID: hog
      CEPH_DEMO_ACCESS_KEY: hogaccesskey
      CEPH_DEMO_SECRET_KEY: hogsecretkey
      CEPH_DEMO_BUCKET: sightpane-frames
      RGW_NAME: localhost
      RGW_FRONTEND_PORT: "8080"
      DEMO_DAEMONS: "mon,mgr,osd,rgw"
    ports:
      - "8080:8080" # RADOS Gateway (S3)
    volumes:
      - ceph-etc:/etc/ceph
      - ceph-lib:/var/lib/ceph
    # The demo image needs elevated privileges to set up its OSD.
    privileged: true
    restart: unless-stopped
    healthcheck:
      # The gateway answering at all is enough; an anonymous list is a 403,
      # which still proves it is up and signing requests.
      test: ["CMD-SHELL", "curl -sf -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ | grep -qE '200|403'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  sightpane-data:
  ceph-etc:
  ceph-lib:
